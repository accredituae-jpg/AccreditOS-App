    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || !storedTheme) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
