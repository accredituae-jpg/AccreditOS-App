    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "AccreditOS",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "Enterprise training and safety management ERP platform with UAE VAT compliance, automated certificate generation, and client billing.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "AED"
          }
        },
        {
          "@type": "Organization",
          "name": "Accredit Management Consultancy",
          "url": "https://accreditos.com",
          "logo": "https://accreditos.com/favicon.ico"
        }
      ]
    }
    </script>

    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || !storedTheme) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

  <body>
